# Run every task inside a container so behavior is identical across host
# operating systems (macOS, Windows, Linux). This avoids environment-specific
# problems such as the native lxml segfaults seen on some macOS setups.
#
# Detection scripts use the slim runtime image; test/lint use the dev image
# (which adds pytest, ruff, mypy, and boto3).
#
# Examples:
#   docker compose run --rm detect         # primary detection
#   docker compose run --rm detect --live  # with live boto3 confirmation
#   docker compose run --rm test           # unit tests
#   docker compose run --rm lint           # ruff + format + mypy
#   docker compose run --rm service-level  # secondary service-level scan
#   docker compose run --rm diff           # compare the two latest runs

services:
  detect:
    build:
      context: .
      target: runtime
    volumes:
      - ./output:/app/output
      - ./history:/app/history
    entrypoint: ["python", "-m", "can_i_tag_aws.detect_api_taggable"]

  service-level:
    build:
      context: .
      target: runtime
    volumes:
      - ./output:/app/output
    entrypoint: ["python", "-m", "can_i_tag_aws.detect_service_level"]

  cfn-map:
    build:
      context: .
      target: runtime
    volumes:
      - ./output:/app/output
    entrypoint: ["python", "-m", "can_i_tag_aws.cfn_to_iam_mapper"]

  diff:
    build:
      context: .
      target: runtime
    volumes:
      - ./output:/app/output
      - ./history:/app/history
    entrypoint: ["python", "-m", "can_i_tag_aws.diff_runs"]

  rgtapi:
    build:
      context: .
      target: dev
    volumes:
      - ./output:/app/output
    # Requires AWS credentials; pass them through from the host environment.
    environment:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_DEFAULT_REGION
      - AWS_PROFILE
    entrypoint: ["python", "-m", "can_i_tag_aws.resource_groups_api.detect_rgtapi"]

  test:
    build:
      context: .
      target: dev
    command: ["pytest", "-q", "-m", "not integration"]

  test-integration:
    build:
      context: .
      target: dev
    command: ["pytest", "-q", "-m", "integration"]

  lint:
    build:
      context: .
      target: dev
    command:
      - sh
      - -c
      - >-
        ruff check . &&
        ruff format --check . &&
        mypy can_i_tag_aws
