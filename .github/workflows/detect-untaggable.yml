name: Detect Untaggable Resources

on:
  schedule:
    # Weekly: Monday 6am UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    env:
      PR_TOKEN: ${{ secrets.PR_BOT_TOKEN || github.token }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ env.PR_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -q -m "not integration"

      - name: Run integration tests
        run: pytest -q -m integration
      
      - name: Run detection
        run: python detect_api_taggable.py

      - name: Prune history (keep latest 3)
        run: |
          python - <<'PY'
          from pathlib import Path

          history_dir = Path("history")
          if not history_dir.exists():
              raise SystemExit(0)

          files = sorted(history_dir.glob("api_taggable_resources_*.json"), reverse=True)
          for f in files[3:]:
              f.unlink()
          PY
      
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ env.PR_TOKEN }}
          commit-message: "chore: update untaggable resources report"
          title: "chore: update untaggable resources report"
          body: |
            Automated update of untaggable resources detection.
            
            Run date: ${{ github.run_id }}
          branch: auto-update-reports
          delete-branch: true
      
      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ env.PR_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # Try auto-merge first (waits on required checks). If the PR is already
          # in clean status with no checks to wait on, GitHub refuses to enable
          # auto-merge, so fall back to a direct squash merge.
          if ! gh pr merge --auto --squash "$PR_NUMBER" 2>&1 | tee /tmp/merge.log; then
            if grep -q "clean status" /tmp/merge.log; then
              gh pr merge --squash "$PR_NUMBER"
            else
              exit 1
            fi
          fi
