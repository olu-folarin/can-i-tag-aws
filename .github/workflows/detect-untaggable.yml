name: Detect Untaggable Resources

on:
  schedule:
    # Quarterly: 1st of Jan, Apr, Jul, Oct at midnight UTC
    - cron: '0 0 1 */3 *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    env:
      PR_TOKEN: ${{ secrets.PR_BOT_TOKEN || github.token }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ env.PR_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -q tests/test_parsing.py tests/test_rgtapi_smoke.py

      - name: Run integration tests
        run: pytest -q tests/test_integration.py
      
      - name: Run detection
        run: python detect_api_taggable.py

      - name: Prune history (keep latest 3)
        run: |
          python - <<'PY'
          from pathlib import Path

          history_dir = Path("history")
          if not history_dir.exists():
              raise SystemExit(0)

          files = sorted(history_dir.glob("api_taggable_resources_*.json"), reverse=True)
          for f in files[3:]:
              f.unlink()
          PY
      
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ env.PR_TOKEN }}
          commit-message: "chore: update untaggable resources report"
          title: "chore: update untaggable resources report"
          body: |
            Automated update of untaggable resources detection.
            
            Run date: ${{ github.run_id }}
          branch: auto-update-reports
          delete-branch: true
      
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ env.PR_TOKEN }}
